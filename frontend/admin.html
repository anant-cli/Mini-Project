<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel - ParkSlot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" id="page-root" style="display:none;">
    <h1 class="text-3xl mb-8">Admin Dashboard</h1>

    <div class="grid grid-3 mb-8" id="report-stats">
      <div class="glass-card text-center"><p class="text-muted text-sm">Gross Volume</p><p class="text-3xl" id="stat-volume">₹0</p></div>
      <div class="glass-card text-center"><p class="text-muted text-sm">Captured Transactions</p><p class="text-3xl" id="stat-transactions">0</p></div>
      <div class="glass-card text-center"><p class="text-muted text-sm">Total Users</p><p class="text-3xl" id="stat-users">0</p></div>
    </div>

    <div class="glass-card mb-8">
      <h2 class="text-2xl mb-4">Pending Listing Approvals</h2>
      <div id="pending-list" class="flex flex-col gap-3">
        <div class="state-msg"><div class="spinner"></div></div>
      </div>
    </div>

    <div class="glass-card mb-8">
      <h2 class="text-2xl mb-4">Open Disputes</h2>
      <div id="disputes-list" class="flex flex-col gap-3">
        <div class="state-msg"><div class="spinner"></div></div>
      </div>
    </div>

    <div class="glass-card">
      <h2 class="text-2xl mb-4">All Users</h2>
      <div id="users-list" class="flex flex-col gap-2">
        <div class="state-msg"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api, { apiErrorMessage } from '/js/api.js';
    import { requireAuth } from '/js/auth.js';
    import { showToast } from '/js/toast.js';
    import { escapeHtml } from '/js/sanitize.js';

    const user = requireAuth(['admin']);
    if (user) document.getElementById('page-root').style.display = 'block';

    function money(n) { return `₹${Number(n).toFixed(0)}`; }

    async function loadReport() {
      try {
        const res = await api.get('/admin/report');
        document.getElementById('stat-volume').textContent = money(res.data.revenue.gross_volume);
        document.getElementById('stat-transactions').textContent = res.data.revenue.total_transactions;
        const totalUsers = (res.data.userCounts || []).reduce((sum, r) => sum + Number(r.count), 0);
        document.getElementById('stat-users').textContent = totalUsers;
      } catch (err) {
        showToast(apiErrorMessage(err, 'Failed to load platform report.'), 'error');
      }
    }

    async function loadPending() {
      const container = document.getElementById('pending-list');
      try {
        const res = await api.get('/listings/admin/pending');
        const listings = res.data.listings || [];

        if (listings.length === 0) {
          container.innerHTML = '<p class="text-muted">No listings awaiting review.</p>';
          return;
        }

        container.innerHTML = listings.map((l) => `
          <div class="glass-card list-card">
            <div class="list-card-row">
              <div>
                <strong>${escapeHtml(l.name)}</strong>
                <p class="text-muted text-sm">${escapeHtml(l.address)}</p>
                <p class="text-sm">${money(l.price_per_hour)}/hr &middot; ${l.total_slots} slots</p>
              </div>
              <div class="flex gap-2">
                <button class="btn btn-primary approve-btn" data-id="${l.location_id}" style="padding:8px 16px; font-size:0.85rem;">Approve</button>
                <button class="btn reject-btn" data-id="${l.location_id}" style="padding:8px 16px; font-size:0.85rem;">Reject</button>
              </div>
            </div>
          </div>
        `).join('');

        container.querySelectorAll('.approve-btn').forEach((btn) => btn.addEventListener('click', () => reviewListing(btn.dataset.id, true)));
        container.querySelectorAll('.reject-btn').forEach((btn) => btn.addEventListener('click', () => reviewListing(btn.dataset.id, false)));
      } catch (err) {
        container.innerHTML = `<p class="text-danger">${apiErrorMessage(err)}</p>`;
      }
    }

    async function reviewListing(id, approve) {
      try {
        await api.patch(`/listings/admin/${id}/review`, { approve });
        showToast(approve ? 'Listing approved.' : 'Listing rejected.', 'success');
        loadPending();
      } catch (err) {
        showToast(apiErrorMessage(err), 'error');
      }
    }

    async function loadDisputes() {
      const container = document.getElementById('disputes-list');
      try {
        const res = await api.get('/admin/disputes');
        const disputes = res.data.disputes || [];

        if (disputes.length === 0) {
          container.innerHTML = '<p class="text-muted">No open disputes.</p>';
          return;
        }

        container.innerHTML = disputes.map((d) => `
          <div class="glass-card list-card">
            <div>
              <strong>${escapeHtml(d.vehicle_number) || 'Booking'} &middot; ${money(d.total_amount || 0)}</strong>
              <p class="text-sm text-muted mt-2">${escapeHtml(d.reason)}</p>
            </div>
            <div class="flex gap-2 mt-2">
              <input type="text" class="glass-input resolution-input" data-id="${d.dispute_id}" placeholder="Resolution note..." style="flex:1;" />
              <button class="btn btn-primary resolve-btn" data-id="${d.dispute_id}" style="padding:10px 16px; font-size:0.85rem;">Resolve</button>
            </div>
          </div>
        `).join('');

        container.querySelectorAll('.resolve-btn').forEach((btn) => {
          btn.addEventListener('click', async () => {
            const input = container.querySelector(`.resolution-input[data-id="${btn.dataset.id}"]`);
            try {
              await api.patch(`/admin/disputes/${btn.dataset.id}/resolve`, { resolution: input.value.trim() || 'Resolved by admin.' });
              showToast('Dispute resolved.', 'success');
              loadDisputes();
            } catch (err) {
              showToast(apiErrorMessage(err), 'error');
            }
          });
        });
      } catch (err) {
        container.innerHTML = `<p class="text-danger">${apiErrorMessage(err)}</p>`;
      }
    }

    async function loadUsers() {
      const container = document.getElementById('users-list');
      try {
        const res = await api.get('/admin/users');
        const users = res.data.users || [];

        container.innerHTML = users.map((u) => `
          <div class="list-card-row" style="padding:10px 4px; border-bottom:1px solid rgba(0,0,0,0.05);">
            <div>
              <strong>${escapeHtml(u.name)}</strong> <span class="text-muted text-sm">(${escapeHtml(u.email)})</span>
              <span class="badge" style="margin-left:8px;">${u.role}</span>
              ${u.is_suspended ? '<span class="badge badge-disabled" style="margin-left:6px;">Suspended</span>' : ''}
            </div>
            ${u.role !== 'admin' && !u.is_suspended ? `<button class="btn suspend-btn" data-id="${u.user_id}" style="padding:6px 14px; font-size:0.8rem;">Suspend</button>` : ''}
          </div>
        `).join('');

        container.querySelectorAll('.suspend-btn').forEach((btn) => {
          btn.addEventListener('click', async () => {
            if (!confirm('Suspend this user? They will be unable to book or list new spaces.')) return;
            try {
              await api.patch(`/admin/users/${btn.dataset.id}/suspend`);
              showToast('User suspended.', 'success');
              loadUsers();
            } catch (err) {
              showToast(apiErrorMessage(err), 'error');
            }
          });
        });
      } catch (err) {
        container.innerHTML = `<p class="text-danger">${apiErrorMessage(err)}</p>`;
      }
    }

    if (user) {
      loadReport();
      loadPending();
      loadDisputes();
      loadUsers();
    }
  </script>
</body>
</html>
