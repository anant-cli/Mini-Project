<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - ParkSlot</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" style="max-width: 500px;">
    <div class="clay-card">
      <h1 class="text-3xl mb-8 text-center">Welcome Back</h1>
      
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="clay-input" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="clay-input" required />
        </div>
        
        <button type="submit" class="clay-btn clay-btn-primary w-full mt-4">Login</button>
      </form>
      
      <div class="text-center mt-8 text-muted">
        Don't have an account? <a href="/signup.html">Sign up</a>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api from '/js/api.js';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await api.post('/auth/login', { email, password });
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('user', JSON.stringify(res.data.user));
        
        // Redirect based on role
        if (['host', 'business_host'].includes(res.data.user.role)) {
          window.location.href = '/host.html';
        } else if (res.data.user.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/search.html';
        }
      } catch (err) {
        alert('Login failed. Please check your credentials.');
        console.error(err);
      }
    });
  </script>
</body>
</html>
