<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - ParkSlot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  
  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" style="max-width: 500px;">
    <div class="card">
      <h1 class="text-3xl mb-8 text-center">Welcome Back</h1>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="input" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="input" required autocomplete="current-password" />
        </div>

        <button type="submit" id="login-submit" class="btn btn-primary w-full mt-4">Login</button>
      </form>
      <div class="agreement-box">

    <!-- Terms & Conditions -->
    <label class="check-row">
        <input type="checkbox" required>
        <span>
            I agree to ParkSlot's
            <a href="terms.html" target="_blank">
                Terms and Conditions
            </a>
            and confirm that I am at least 18 years of age.<br>
        </span>
    </label>

    <!-- Privacy Policy -->
    <label class="check-row">
        <input type="checkbox" required>
        <span>
            I consent to the collection and use of my personal information
            in accordance with the
            <a href="privacy.html" target="_blank">
                Privacy Policy
            </a>.
        </span>
    </label>

</div>
      <div class="text-center mt-8 text-muted">
        Don't have an account? <a href="/signup.html">Sign up</a>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api, { apiErrorMessage } from '/js/api.js';
    import { getUser } from '/js/auth.js';
    import { showToast } from '/js/toast.js';

    // Already logged in? Skip the login screen.
    const existing = getUser();
    if (existing) {
      window.location.href = ['host', 'business_host'].includes(existing.role)
        ? '/host.html'
        : existing.role === 'admin' ? '/admin.html' : '/search.html';
    }

    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('login-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Logging in...';

      try {
        const res = await api.post('/auth/login', { email, password });
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('user', JSON.stringify(res.data.user));

        if (['host', 'business_host'].includes(res.data.user.role)) {
          window.location.href = '/host.html';
        } else if (res.data.user.role === 'admin') {
          window.location.href = '/admin.html';
        } else {
          window.location.href = '/search.html';
        }
      } catch (err) {
        showToast(apiErrorMessage(err, 'Login failed. Please check your credentials.'), 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Login';
      }
      
    });
    
    
  </script>
</body>
</html>
