<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - ParkSlot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" style="max-width: 500px;">
    <div class="card">
      <div class="onboarding-steps" aria-hidden="true">
        <span class="step-dot step-active"></span>
        <span class="step-dot"></span>
        <span class="step-dot"></span>
      </div>
      <h1 class="text-3xl mb-2 text-center">Create an Account</h1>
      <p class="text-muted text-sm text-center mb-8">Step 1 of 3 — account details</p>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="input" required minlength="2" autocomplete="name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="input" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone</label>
          <input type="tel" id="phone" class="input" required autocomplete="tel" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="input" required minlength="8" autocomplete="new-password" />
          <small class="text-muted text-sm">At least 8 characters, with a letter and a number.</small>
        </div>
        <div class="form-group">
          <label class="form-label" for="role">I want to...</label>
          <select id="role" class="input" style="padding: 14px 20px;" required>
            <option value="driver">Driver</option>
            <option value="host">Host</option>
            <option value="business_host">Host a commercial lot (Business)</option>
          </select>
        </div>

        <div class="agreement-box">
          <label class="check-row">
            <input type="checkbox" id="agree-terms" required>
            <span>
              I agree to ParkSlot's
              <a href="/terms.html" target="_blank">Terms and Conditions</a>
              and confirm that I am at least 18 years of age.
            </span>
          </label>
          <label class="check-row">
            <input type="checkbox" id="agree-privacy" required>
            <span>
              I consent to the collection and use of my personal information in accordance with the
              <a href="/privacy.html" target="_blank">Privacy Policy</a>.
            </span>
          </label>
        </div>

        <p id="signup-error" class="text-danger text-sm mb-2" style="display:none;"></p>
        <button type="submit" id="signup-submit" class="btn btn-primary w-full mt-4">Continue</button>
      </form>

      <div class="text-center mt-8 text-muted">
        Already have an account? <a href="/login.html">Login</a>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api, { apiErrorMessage } from '/js/api.js';

    const form = document.getElementById('signup-form');
    const submitBtn = document.getElementById('signup-submit');
    const errorEl = document.getElementById('signup-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const res = await api.post('/auth/signup', {
          name, email, password, role,
          ...(phone ? { phone } : {}),
        });
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('user', JSON.stringify(res.data.user));
        window.location.href = '/verify-email.html';
      } catch (err) {
        errorEl.textContent = apiErrorMessage(err, 'Signup failed. Please try again.');
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Continue';
      }
    });
  
    </script>
</body>
</html>
