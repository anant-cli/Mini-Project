<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - ParkSlot</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" style="max-width: 500px;">
    <div class="clay-card">
      <h1 class="text-3xl mb-8 text-center">Create an Account</h1>
      
      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="clay-input" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="clay-input" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="clay-input" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="role">I want to...</label>
          <select id="role" class="clay-input" style="padding: 14px 20px;" required>
            <option value="driver">Find parking (Driver)</option>
            <option value="host">Host my space (Host)</option>
          </select>
        </div>
        
        <button type="submit" class="clay-btn clay-btn-primary w-full mt-4">Sign Up</button>
      </form>
      
      <div class="text-center mt-8 text-muted">
        Already have an account? <a href="/login.html">Login</a>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api from '/js/api.js';

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      try {
        const res = await api.post('/auth/register', { name, email, password, role });
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('user', JSON.stringify(res.data.user));
        
        if (['host', 'business_host'].includes(res.data.user.role)) {
          window.location.href = '/host.html';
        } else {
          window.location.href = '/search.html';
        }
      } catch (err) {
        alert('Signup failed. Please try again.');
        console.error(err);
      }
    });
  </script>
</body>
</html>
