<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - ParkSlot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" style="max-width: 500px;">
    <div class="card">
      <h1 class="text-3xl mb-8 text-center">Create an Account</h1>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="input" required minlength="5" autocomplete="name" />
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="input" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone</label>
          <input type="tel" id="phone" class="input" required autocomplete="tel" />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="input" required minlength="8" autocomplete="new-password" />
          <small class="text-muted text-sm">At least 8 characters.</small>
        </div>
        <div class="form-group">
          <label class="form-label" for="role">I want to...</label>
          <select id="role" class="input" style="padding: 14px 20px;" required>
            <option value="driver">Driver</option>
            <option value="host">Host</option>
            <option value="business_host">Host a commercial lot (Business)</option>
          </select>
        </div>

        <button type="submit" id="signup-submit" class="btn btn-primary w-full mt-4">Sign Up</button>
      </form>

      <div class="text-center mt-8 text-muted">
        Already have an account? <a href="/login.html">Login</a>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api, { apiErrorMessage } from '/js/api.js';
    import { showToast } from '/js/toast.js';

    const form = document.getElementById('signup-form');
    const submitBtn = document.getElementById('signup-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        // NOTE: the backend route is /auth/signup, not /auth/register.
        const res = await api.post('/auth/signup', {
          name, email, password, role,
          ...(phone ? { phone } : {}),
        });
        localStorage.setItem('token', res.data.token);
        localStorage.setItem('user', JSON.stringify(res.data.user));

        if (['host', 'business_host'].includes(res.data.user.role)) {
          window.location.href = '/host.html';
        } else {
          window.location.href = '/search.html';
        }
      } catch (err) {
        showToast(apiErrorMessage(err, 'Signup failed. Please try again.'), 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign Up';
      }
    });
  </script>
</body>
</html>
