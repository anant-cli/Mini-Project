<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listing Details - ParkSlot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" id="page-root">
    <div class="state-msg"><div class="spinner"></div><p class="text-muted">Loading listing...</p></div>
  </main>

  <template id="listing-template">
    <div class="card">
      <div class="flex justify-between items-center" style="flex-wrap: wrap; gap: 12px;">
        <div>
          <h1 class="text-3xl mb-2"><span data-field="name"></span> <span data-field="rating" style="font-size: 1rem; color: var(--color-rating); vertical-align: middle; font-weight: normal;"></span></h1>
          <p class="text-muted text-xl" data-field="address"></p>
          <p class="text-sm text-muted mt-2">Hosted by <span data-field="host_name"></span></p>
        </div>
        <button id="fav-btn" class="btn" style="white-space:nowrap;">&#9825; Save</button>
      </div>

      <div class="flex gap-8 mt-4" style="flex-wrap: wrap;">
        <div style="flex: 2; min-width: 280px;">
          <div class="card" style="background:var(--color-highlight);">
            <div class="flex justify-between items-center mb-2">
              <h2 class="text-2xl" data-field="price"></h2>
              <span class="badge" data-field="ev-badge"></span>
            </div>
            <p class="text-muted mb-2">Vehicle types: <span data-field="vehicle-types"></span></p>
            <p class="text-muted mb-2">Hours: <span data-field="hours"></span></p>

            <h3 class="font-semibold mt-4 mb-2">Slot availability</h3>
            <div id="slot-grid" class="slot-grid"></div>

            <div id="ev-charger-list" class="mt-4"></div>

            <h3 class="font-semibold mt-4 mb-2">Reviews</h3>
            <div id="reviews-list" class="flex flex-col gap-2"></div>
          </div>
        </div>

        <div style="flex: 1; min-width: 280px;">
          <div class="card">
            <h2 class="text-xl mb-4">Book this spot</h2>
            <form id="booking-form">
              <div class="form-group">
                <label class="form-label" for="slot-select">Slot</label>
                <select id="slot-select" class="input" style="padding:14px 20px;" required></select>
              </div>
              <div class="form-group">
                <label class="form-label" for="vehicle-number">Vehicle number</label>
                <input type="text" id="vehicle-number" class="input" placeholder="e.g. KA01AB1234" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="start-time">Start Time</label>
                <input type="datetime-local" id="start-time" class="input" required />
              </div>
              <div class="form-group">
                <label class="form-label" for="end-time">End Time</label>
                <input type="datetime-local" id="end-time" class="input" required />
              </div>
              <p id="estimate" class="text-muted mb-2"></p>
              <button type="submit" id="book-submit" class="btn btn-primary w-full mt-2">Proceed to Pay</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </template>

  <div id="payment-modal" class="modal-backdrop" style="display:none;">
    <div class="card modal-box" style="text-align: left;">
      <h2 class="text-xl mb-4">Complete Payment</h2>
      <div id="payment-summary" class="card mb-4" style="padding:12px; background:var(--color-surface-raised);"></div>
      <form id="payment-form">
        <div class="form-group">
          <label class="form-label">Card Number</label>
          <input type="text" class="input" placeholder="0000 0000 0000 0000" required maxlength="19" />
        </div>
        <div class="flex gap-4">
          <div class="form-group" style="flex:1;">
            <label class="form-label">Expiry</label>
            <input type="text" class="input" placeholder="MM/YY" required maxlength="5" />
          </div>
          <div class="form-group" style="flex:1;">
            <label class="form-label">CVV</label>
            <input type="password" class="input" placeholder="123" required maxlength="4" />
          </div>
        </div>
        <button type="submit" id="pay-submit" class="btn btn-primary w-full mt-4">Pay Now</button>
        <button type="button" id="pay-cancel" class="btn w-full mt-2">Cancel</button>
      </form>
    </div>
  </div>

  <div id="qr-modal" class="modal-backdrop" style="display:none;">
    <div class="card modal-box">
      <h2 class="text-xl mb-4">Booking confirmed!</h2>
      <img id="qr-image" src="" alt="QR pass" />
      <p class="text-muted text-sm mt-4">Show this QR code to the host when you arrive.</p>
      <button id="qr-close" class="btn btn-primary w-full mt-4">Go to My Bookings</button>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/pages/listing.js"></script>
</body>
</html>
