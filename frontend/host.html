<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Host Dashboard - ParkSlot</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl">Host Dashboard</h1>
      <button id="add-listing-btn" class="clay-btn clay-btn-primary">+ Add New Listing</button>
    </div>

    <div class="clay-card mb-8" id="add-listing-form" style="display: none;">
      <h2 class="text-2xl mb-4">Create Listing</h2>
      <form id="create-listing-form">
        <div class="flex gap-4 mb-4">
          <div class="form-group w-full">
            <label class="form-label" for="address">Address</label>
            <input type="text" id="address" class="clay-input" required />
          </div>
          <div class="form-group w-full">
            <label class="form-label" for="price">Price Per Hour ($)</label>
            <input type="number" id="price" class="clay-input" required />
          </div>
        </div>
        <div class="flex gap-4 mb-4">
          <div class="form-group w-full">
            <label class="form-label" for="lat">Latitude</label>
            <input type="text" id="lat" class="clay-input" required />
          </div>
          <div class="form-group w-full">
            <label class="form-label" for="lng">Longitude</label>
            <input type="text" id="lng" class="clay-input" required />
          </div>
        </div>
        <div class="form-group mb-4">
          <label class="form-label" for="type">Space Type</label>
          <select id="type" class="clay-input" style="padding: 14px 20px;">
            <option value="driveway">Driveway</option>
            <option value="garage">Garage</option>
            <option value="commercial">Commercial</option>
          </select>
        </div>
        <button type="submit" class="clay-btn clay-btn-primary">Save Listing</button>
        <button type="button" class="clay-btn clay-btn-secondary" id="cancel-listing-btn">Cancel</button>
      </form>
    </div>

    <div class="clay-card">
      <h2 class="text-2xl mb-4">Your Listings</h2>
      <div id="host-listings" class="flex flex-col gap-4">
        <p class="text-muted">Loading...</p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api from '/js/api.js';

    document.getElementById('add-listing-btn').addEventListener('click', () => {
      document.getElementById('add-listing-form').style.display = 'block';
    });
    
    document.getElementById('cancel-listing-btn').addEventListener('click', () => {
      document.getElementById('add-listing-form').style.display = 'none';
    });

    async function loadListings() {
      try {
        const res = await api.get('/listings/host/me');
        const listings = res.data.data || res.data;
        const container = document.getElementById('host-listings');
        
        if (listings.length === 0) {
          container.innerHTML = '<p class="text-muted">You have no listings yet.</p>';
          return;
        }

        container.innerHTML = listings.map(l => `
          <div class="clay-card" style="padding: 16px;">
            <div class="flex justify-between items-center">
              <div>
                <strong>${l.address}</strong>
                <p class="text-muted text-sm">$${l.pricePerHour}/hr • ${l.type}</p>
              </div>
              <span style="color: ${l.status === 'active' ? 'var(--color-success)' : 'var(--color-warning)'}">${l.status}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        document.getElementById('host-listings').innerHTML = '<p class="text-danger">Failed to load listings.</p>';
      }
    }

    document.getElementById('create-listing-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const address = document.getElementById('address').value;
      const price = document.getElementById('price').value;
      const lat = document.getElementById('lat').value;
      const lng = document.getElementById('lng').value;
      const type = document.getElementById('type').value;

      try {
        await api.post('/listings', {
          address,
          pricePerHour: parseFloat(price),
          location: { type: 'Point', coordinates: [parseFloat(lng), parseFloat(lat)] },
          type
        });
        alert('Listing created!');
        document.getElementById('add-listing-form').style.display = 'none';
        loadListings();
      } catch (err) {
        console.error(err);
        alert('Failed to create listing.');
      }
    });

    loadListings();
  </script>
</body>
</html>
