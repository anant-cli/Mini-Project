<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Email - ParkSlot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" style="max-width: 460px;">
    <div class="card">
      <div class="onboarding-steps" aria-hidden="true">
        <span class="step-dot step-done"></span>
        <span class="step-dot step-active"></span>
        <span class="step-dot"></span>
      </div>
      <h1 class="text-2xl mb-2 text-center">Verify Your Email</h1>
      <p class="text-muted text-sm text-center mb-8">
        We sent a 6-digit code to <strong id="user-email"></strong>. It expires in 10 minutes.
      </p>

      <form id="verify-form">
        <div class="form-group">
          <label class="form-label" for="otp">Verification code</label>
          <input type="text" id="otp" class="input otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                 autocomplete="one-time-code" required placeholder="000000" />
        </div>
        <p id="verify-error" class="text-danger text-sm mb-2" style="display:none;"></p>
        <button type="submit" id="verify-submit" class="btn btn-primary w-full">Verify</button>
      </form>

      <div class="text-center mt-6">
        <button id="resend-btn" class="btn" style="background:none; border:none; text-decoration:underline; padding:0;">
          Resend code
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api, { apiErrorMessage } from '/js/api.js';
    import { getUser, getToken, logout } from '/js/auth.js';
    import { showToast } from '/js/toast.js';

    const user = getUser();
    if (!user || !getToken()) {
      window.location.href = '/login.html';
    } else {
      document.getElementById('user-email').textContent = user.email;
      if (user.email_verified) {
        goNext();
      }
    }

    function goNext() {
      if (user.kyc_status && user.kyc_status !== 'unsubmitted') {
        goToApp();
      } else {
        window.location.href = '/kyc-setup.html';
      }
    }

    function goToApp() {
      if (['host', 'business_host'].includes(user.role)) window.location.href = '/host.html';
      else if (user.role === 'admin') window.location.href = '/admin.html';
      else window.location.href = '/search.html';
    }

    const form = document.getElementById('verify-form');
    const errorEl = document.getElementById('verify-error');
    const otpInput = document.getElementById('otp');
    otpInput.addEventListener('input', () => {
      otpInput.value = otpInput.value.replace(/\D/g, '').slice(0, 6);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      const submitBtn = document.getElementById('verify-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Verifying...';

      try {
        await api.post('/auth/verify-email', { otp: otpInput.value });
        user.email_verified = true;
        localStorage.setItem('user', JSON.stringify(user));
        showToast('Email verified!', 'success');
        window.location.href = '/kyc-setup.html';
      } catch (err) {
        errorEl.textContent = apiErrorMessage(err, 'Could not verify that code.');
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Verify';
      }
    });

    let cooldown = 0;
    let cooldownTimer = null;
    const resendBtn = document.getElementById('resend-btn');

    function tickCooldown() {
      cooldown -= 1;
      if (cooldown <= 0) {
        clearInterval(cooldownTimer);
        resendBtn.disabled = false;
        resendBtn.textContent = 'Resend code';
      } else {
        resendBtn.textContent = `Resend code (${cooldown}s)`;
      }
    }

    resendBtn.addEventListener('click', async () => {
      resendBtn.disabled = true;
      try {
        await api.post('/auth/resend-otp', { purpose: 'email_verify' });
        showToast('A new code was sent to your email.', 'success');
        cooldown = 60;
        resendBtn.textContent = `Resend code (${cooldown}s)`;
        cooldownTimer = setInterval(tickCooldown, 1000);
      } catch (err) {
        showToast(apiErrorMessage(err, 'Could not resend the code.'), 'error');
        resendBtn.disabled = false;
      }
    });
  
    </script>
</body>
</html>
