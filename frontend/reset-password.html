<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password - ParkSlot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" style="max-width: 460px;">
    <div class="card">
      <h1 class="text-2xl mb-2 text-center">Reset Password</h1>
      <p class="text-muted text-sm text-center mb-8">
        Enter the code we emailed you along with a new password.
      </p>

      <form id="reset-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="input" required autocomplete="email" />
        </div>
        <div class="form-group">
          <label class="form-label" for="otp">Reset code</label>
          <input type="text" id="otp" class="input otp-input" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                 autocomplete="one-time-code" required placeholder="000000" />
        </div>
        <div class="form-group">
          <label class="form-label" for="new-password">New password</label>
          <input type="password" id="new-password" class="input" required minlength="8" autocomplete="new-password" />
          <small class="text-muted text-sm">At least 8 characters, with a letter and a number.</small>
        </div>
        <p id="reset-error" class="text-danger text-sm mb-2" style="display:none;"></p>
        <button type="submit" id="reset-submit" class="btn btn-primary w-full">Reset Password</button>
      </form>

      <div class="text-center mt-6">
        <a href="/forgot-password.html">Didn't get a code? Request a new one</a>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api, { apiErrorMessage } from '/js/api.js';
    import { showToast } from '/js/toast.js';

    const rememberedEmail = sessionStorage.getItem('reset_email');
    if (rememberedEmail) document.getElementById('email').value = rememberedEmail;

    const otpInput = document.getElementById('otp');
    otpInput.addEventListener('input', () => {
      otpInput.value = otpInput.value.replace(/\D/g, '').slice(0, 6);
    });

    const form = document.getElementById('reset-form');
    const errorEl = document.getElementById('reset-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.style.display = 'none';
      const submitBtn = document.getElementById('reset-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';

      try {
        await api.post('/auth/reset-password', {
          email: document.getElementById('email').value.trim(),
          otp: otpInput.value,
          new_password: document.getElementById('new-password').value,
        });
        sessionStorage.removeItem('reset_email');
        showToast('Password reset. Please log in.', 'success');
        window.location.href = '/login.html';
      } catch (err) {
        errorEl.textContent = apiErrorMessage(err, 'Could not reset your password.');
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
