<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Listings - ParkSlot</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8">
    <h1 class="text-3xl mb-8">Saved Listings</h1>

    <div class="clay-card">
      <div id="saved-list" class="flex flex-col gap-4">
        <p class="text-muted">Loading...</p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api from '/js/api.js';

    async function loadSaved() {
      try {
        const res = await api.get('/users/saved-listings'); // Assuming route exists
        const listings = res.data.data || res.data;
        const container = document.getElementById('saved-list');
        
        if (listings.length === 0) {
          container.innerHTML = '<p class="text-muted">You have no saved listings.</p>';
          return;
        }

        container.innerHTML = listings.map(l => `
          <div class="clay-card" style="padding: 16px;">
            <div class="flex justify-between items-center">
              <div>
                <strong>${l.address}</strong>
                <p class="text-muted text-sm">$${l.pricePerHour}/hr • ${l.type}</p>
              </div>
              <a href="/listing.html?id=${l._id}" class="clay-btn clay-btn-primary">View</a>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        document.getElementById('saved-list').innerHTML = '<p class="text-muted">Failed to load saved listings or endpoint does not exist.</p>';
      }
    }

    loadSaved();
  </script>
</body>
</html>
