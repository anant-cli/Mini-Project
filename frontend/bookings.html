<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings - ParkSlot</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" id="page-root" style="display:none;">
    <h1 class="text-3xl mb-8">My Bookings</h1>

    <div class="clay-card">
      <div id="bookings-list" class="flex flex-col gap-4">
        <div class="state-msg"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <div id="qr-modal" class="modal-backdrop" style="display:none;">
    <div class="clay-card modal-box">
      <h2 class="text-xl mb-4">Your QR Pass</h2>
      <img id="qr-image" src="" alt="QR pass" />
      <button id="qr-close" class="clay-btn clay-btn-primary w-full mt-4">Close</button>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api, { apiErrorMessage } from '/js/api.js';
    import { requireAuth } from '/js/auth.js';
    import { showToast } from '/js/toast.js';

    const user = requireAuth();
    if (user) document.getElementById('page-root').style.display = 'block';

    function money(n) { return `₹${Number(n).toFixed(0)}`; }

    async function loadBookings() {
      const container = document.getElementById('bookings-list');
      try {
        const res = await api.get('/bookings/mine');
        const bookings = res.data.bookings || [];

        if (bookings.length === 0) {
          container.innerHTML = '<p class="text-muted">You have no bookings yet. <a href="/search.html">Find parking &rarr;</a></p>';
          return;
        }

        container.innerHTML = bookings.map((b) => `
          <div class="clay-card list-card" style="padding:16px 20px;">
            <div class="list-card-row">
              <div>
                <strong>${b.location_name}</strong>
                <p class="text-sm text-muted">${b.address}</p>
                <p class="text-sm text-muted">${new Date(b.start_time).toLocaleString()} &rarr; ${new Date(b.end_time).toLocaleString()}</p>
                <p class="text-sm mt-2">${money(b.total_amount || b.estimated_amount)}${b.overtime_amount > 0 ? ` (incl. ${money(b.overtime_amount)} overtime)` : ''}</p>
              </div>
              <span class="badge badge-${b.status}">${b.status.replace('_', ' ')}</span>
            </div>
            <div class="flex gap-2 mt-2" style="flex-wrap:wrap;">
              ${['pending', 'confirmed'].includes(b.status) ? `<button class="clay-btn qr-btn" data-id="${b.booking_id}" style="padding:8px 16px; font-size:0.85rem;">Show QR Pass</button>` : ''}
              ${['pending', 'confirmed'].includes(b.status) ? `<button class="clay-btn cancel-btn" data-id="${b.booking_id}" style="padding:8px 16px; font-size:0.85rem;">Cancel</button>` : ''}
              ${b.status === 'completed' && !b.location_review_id ? `<button class="clay-btn review-btn" data-id="${b.booking_id}" style="padding:8px 16px; font-size:0.85rem;">Leave a review</button>` : ''}
            </div>
          </div>
        `).join('');

        container.querySelectorAll('.qr-btn').forEach((btn) => btn.addEventListener('click', () => showQr(btn.dataset.id)));
        container.querySelectorAll('.cancel-btn').forEach((btn) => btn.addEventListener('click', () => cancelBooking(btn.dataset.id)));
        container.querySelectorAll('.review-btn').forEach((btn) => btn.addEventListener('click', () => leaveReview(btn.dataset.id)));
      } catch (err) {
        container.innerHTML = `<p class="text-danger">${apiErrorMessage(err, 'Failed to load bookings.')}</p>`;
      }
    }

    async function showQr(bookingId) {
      try {
        const res = await api.get(`/bookings/${bookingId}/pass`);
        document.getElementById('qr-image').src = res.data.qr_pass;
        document.getElementById('qr-modal').style.display = 'flex';
      } catch (err) {
        showToast(apiErrorMessage(err), 'error');
      }
    }

    async function cancelBooking(bookingId) {
      if (!confirm('Cancel this booking?')) return;
      try {
        await api.patch(`/bookings/${bookingId}/cancel`);
        showToast('Booking cancelled.', 'success');
        loadBookings();
      } catch (err) {
        showToast(apiErrorMessage(err), 'error');
      }
    }

    async function leaveReview(bookingId) {
      const rating = prompt('Rate this parking spot 1-5:', '5');
      if (!rating) return;
      const comment = prompt('Add a comment (optional):', '') || undefined;
      try {
        await api.post('/reviews/location', { booking_id: bookingId, rating: Number(rating), comment });
        showToast('Thanks for the review!', 'success');
        loadBookings();
      } catch (err) {
        showToast(apiErrorMessage(err), 'error');
      }
    }

    document.getElementById('qr-close').addEventListener('click', () => {
      document.getElementById('qr-modal').style.display = 'none';
    });

    if (user) loadBookings();
  </script>
</body>
</html>
