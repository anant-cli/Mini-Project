<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings - ParkSlot</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8">
    <h1 class="text-3xl mb-8">My Bookings</h1>

    <div class="clay-card">
      <div id="bookings-list" class="flex flex-col gap-4">
        <p class="text-muted">Loading...</p>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api from '/js/api.js';

    async function loadBookings() {
      try {
        const res = await api.get('/bookings');
        const bookings = res.data.data || res.data;
        const container = document.getElementById('bookings-list');
        
        if (bookings.length === 0) {
          container.innerHTML = '<p class="text-muted">You have no bookings yet.</p>';
          return;
        }

        container.innerHTML = bookings.map(b => `
          <div class="clay-card" style="padding: 16px;">
            <div class="flex justify-between items-center">
              <div>
                <strong>${b.listing ? b.listing.address : 'Unknown Listing'}</strong>
                <p class="text-muted text-sm">
                  ${new Date(b.startTime).toLocaleString()} - ${new Date(b.endTime).toLocaleString()}
                </p>
                <p class="text-sm" style="color:var(--color-primary)">Total: $${b.totalPrice}</p>
              </div>
              <span style="font-weight: bold; color: ${b.status === 'confirmed' ? 'var(--color-success)' : 'var(--color-warning)'}">${b.status}</span>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        document.getElementById('bookings-list').innerHTML = '<p class="text-danger">Failed to load bookings.</p>';
      }
    }

    loadBookings();
  </script>
</body>
</html>
