<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Bookings - ParkSlot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" id="page-root" style="display:none;">
    <h1 class="text-3xl mb-8">My Bookings</h1>

    <div class="card">
      <div id="bookings-list" class="flex flex-col gap-4">
        <div class="state-msg"><div class="spinner"></div></div>
      </div>
    </div>
  </main>

  <div id="qr-modal" class="modal-backdrop" style="display:none;">
    <div class="card modal-box">
      <h2 class="text-xl mb-4">Your QR Pass</h2>
      <img id="qr-image" src="" alt="QR pass" />
      <button id="qr-close" class="btn btn-primary w-full mt-4">Close</button>
    </div>
  </div>

  <div id="review-modal" class="modal-backdrop" style="display:none;">
    <div class="card modal-box">
      <h2 class="text-xl mb-4">Rate this parking spot</h2>
      <div id="review-star-widget" class="star-input mb-4" style="justify-content:center; font-size:2rem;"></div>
      <textarea id="review-comment" class="input mb-4" placeholder="Optional comment..."></textarea>
      <button id="review-submit" class="btn btn-primary w-full" disabled>Submit Review</button>
      <button id="review-cancel" class="btn w-full mt-2">Cancel</button>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/pages/bookings.js"></script>
</body>
</html>
