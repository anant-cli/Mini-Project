<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Your Identity - ParkSlot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" style="max-width: 500px;">
    <div class="card">
      <div class="onboarding-steps" aria-hidden="true">
        <span class="step-dot step-done"></span>
        <span class="step-dot step-done"></span>
        <span class="step-dot step-active"></span>
      </div>
      <h1 class="text-2xl mb-2 text-center">Verify Your Identity</h1>
      <p class="text-muted text-sm text-center mb-8">
        Required for every ParkSlot account, so hosts and drivers can trust who they're dealing with.
      </p>

      <form id="kyc-form">
        <div class="form-group">
          <label class="form-label" for="kyc-id-doc">Government ID photo</label>
          <input type="file" id="kyc-id-doc" class="input" accept="image/png,image/jpeg,image/webp" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="kyc-selfie">A clear selfie of your face</label>
          <input type="file" id="kyc-selfie" class="input" accept="image/png,image/jpeg,image/webp" required />
        </div>
        <div class="form-group checkbox-row">
          <input type="checkbox" id="kyc-consent" required />
          <label for="kyc-consent" id="kyc-consent-label"></label>
        </div>
        <p id="kyc-error" class="text-danger text-sm mb-2" style="display:none;"></p>
        <button type="submit" id="kyc-submit" class="btn btn-primary w-full">Submit &amp; Continue</button>
      </form>
      <p class="text-muted text-sm text-center mt-4">
        Submitted for admin review, which usually takes a short while — you can explore the app in the meantime.
      </p>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api, { apiErrorMessage } from '/js/api.js';
    import { getUser, getToken } from '/js/auth.js';
    import { showToast } from '/js/toast.js';

    const user = getUser();
    if (!user || !getToken()) {
      window.location.href = '/login.html';
    } else if (!user.email_verified) {
      window.location.href = '/verify-email.html';
    } else if (user.kyc_status && user.kyc_status !== 'unsubmitted') {
      goToApp();
    }

    const CONSENT_LABELS = {
      host: 'I declare that I own this place or have the legal right to list it, and I consent to ParkSlot verifying my identity.',
      business_host: 'I declare that I own this place or have the legal right to list it, and I consent to ParkSlot verifying my identity.',
      driver: 'I confirm I am parking my own vehicle at my own decision and responsibility, and I consent to ParkSlot verifying my identity.',
    };
    document.getElementById('kyc-consent-label').textContent = CONSENT_LABELS[user?.role] || CONSENT_LABELS.driver;

    function goToApp() {
      if (['host', 'business_host'].includes(user.role)) window.location.href = '/host.html';
      else if (user.role === 'admin') window.location.href = '/admin.html';
      else window.location.href = '/search.html';
    }

    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Could not read the selected file'));
        reader.readAsDataURL(file);
      });
    }

    document.getElementById('kyc-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('kyc-error');
      errorEl.style.display = 'none';

      const idFile = document.getElementById('kyc-id-doc').files[0];
      const selfieFile = document.getElementById('kyc-selfie').files[0];
      if (!idFile || !selfieFile) {
        errorEl.textContent = 'Please choose both an ID photo and a selfie.';
        errorEl.style.display = 'block';
        return;
      }

      const submitBtn = document.getElementById('kyc-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      try {
        const [idDoc, selfie] = await Promise.all([fileToDataUrl(idFile), fileToDataUrl(selfieFile)]);
        await api.post('/kyc', {
          id_document_image: idDoc,
          selfie_image: selfie,
          consent: document.getElementById('kyc-consent').checked,
        });
        user.kyc_status = 'pending';
        localStorage.setItem('user', JSON.stringify(user));
        showToast('Identity documents submitted for review.', 'success');
        goToApp();
      } catch (err) {
        errorEl.textContent = apiErrorMessage(err, 'Could not submit your documents.');
        errorEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit & Continue';
      }
    });
  </script>
</body>
</html>
