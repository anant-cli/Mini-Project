<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password - ParkSlot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" style="max-width: 460px;">
    <div class="card">
      <h1 class="text-2xl mb-2 text-center">Forgot Password</h1>
      <p class="text-muted text-sm text-center mb-8">
        Enter the email on your account and we'll send you a reset code.
      </p>

      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="input" required autocomplete="email" />
        </div>
        <button type="submit" id="forgot-submit" class="btn btn-primary w-full">Send Reset Code</button>
      </form>

      <div class="text-center mt-8 text-muted">
        <a href="/login.html">Back to login</a>
      </div>
    </div>
  </main>

  <script type="module" src="/js/auth.js"></script>
  <script type="module">
    import api, { apiErrorMessage } from '/js/api.js';
    import { showToast } from '/js/toast.js';

    const form = document.getElementById('forgot-form');
    const submitBtn = document.getElementById('forgot-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending...';

      try {
        await api.post('/auth/forgot-password', { email });
        // The backend intentionally always returns this same generic
        // message whether or not the email is registered, so we never
        // leak account existence — carry that through to the UI as-is.
        showToast('If an account exists for that email, a reset code has been sent.', 'success');
        sessionStorage.setItem('reset_email', email);
        window.location.href = '/reset-password.html';
      } catch (err) {
        showToast(apiErrorMessage(err, 'Something went wrong. Please try again.'), 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Reset Code';
      }
    });
  </script>
</body>
</html>
