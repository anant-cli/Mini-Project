<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Account Settings - ParkSlot</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="container flex justify-between items-center">
      <a href="/index.html" class="navbar-brand">ParkSlot</a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main class="container mt-8" id="page-root" style="display:none; max-width: 640px;">
    <h1 class="text-3xl mb-8">Account Settings</h1>

    <div class="card mb-8">
      <h2 class="text-xl mb-4">Your details</h2>
      <div class="flex flex-col gap-3">
        <div class="flex justify-between items-center">
          <span class="text-muted">Name</span>
          <span class="font-semibold" id="acct-name"></span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-muted">Email</span>
          <span class="font-semibold" id="acct-email"></span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-muted">Account type</span>
          <span class="badge badge-available" id="acct-role"></span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-muted">Member since</span>
          <span class="font-semibold" id="acct-created"></span>
        </div>
      </div>
    </div>

    <div class="card mb-8" id="kyc-card">
      <div class="flex justify-between items-center mb-4" style="flex-wrap:wrap; gap:8px;">
        <h2 class="text-xl" style="margin:0;">Identity verification</h2>
        <span class="badge" id="kyc-badge">—</span>
      </div>
      <p class="text-muted text-sm mb-4" id="kyc-copy"></p>

      <form id="kyc-form" style="display:none;">
        <div class="form-group">
          <label class="form-label" for="kyc-id-doc">Government ID photo</label>
          <input type="file" id="kyc-id-doc" class="input" accept="image/png,image/jpeg,image/webp" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="kyc-selfie">A clear selfie of your face</label>
          <input type="file" id="kyc-selfie" class="input" accept="image/png,image/jpeg,image/webp" required />
        </div>
        <div class="form-group checkbox-row">
          <input type="checkbox" id="kyc-consent" required />
          <label for="kyc-consent" id="kyc-consent-label"></label>
        </div>
        <p id="kyc-error" class="text-danger text-sm mb-2" style="display:none;"></p>
        <button type="submit" id="kyc-submit" class="btn btn-primary">Submit for review</button>
      </form>
    </div>

    <div class="card danger-zone">
      <h2 class="text-xl mb-2">Delete account</h2>
      <p class="text-muted text-sm mb-4" id="danger-copy">
        This permanently deletes your account and everything tied to it. This cannot be undone.
      </p>
      <button id="open-delete" class="btn btn-danger">Delete my account</button>
    </div>
  </main>

  <div id="delete-modal" class="modal-backdrop" style="display:none;">
    <div class="card modal-box" style="text-align:left;">
      <h2 class="text-xl mb-2">Delete your account?</h2>
      <p class="text-muted text-sm mb-4" id="delete-warning"></p>
      <div class="form-group">
        <label class="form-label" for="delete-password">Confirm your password</label>
        <input type="password" id="delete-password" class="input" autocomplete="current-password" required />
      </div>
      <p id="delete-error" class="text-danger text-sm mb-2" style="display:none;"></p>
      <button id="confirm-delete" class="btn btn-danger w-full">Permanently delete my account</button>
      <button id="cancel-delete" class="btn w-full mt-2">Cancel</button>
    </div>
  </div>

  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/pages/account.js"></script>
</body>
</html>
